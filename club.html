<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureShop - Клубная карта</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .club-header {
            text-align: center;
            padding: 4rem 2rem;
            background-image: linear-gradient(to right, rgba(46, 125, 50, 0.9), rgba(104, 159, 56, 0.9)), url('../images/club-bg.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            margin-bottom: 3rem;
        }
        
        .club-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .club-header p {
            max-width: 800px;
            margin: 0 auto 2rem;
            font-size: 1.1rem;
        }
        
        .club-container {
            padding: 0 2rem 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .benefit-card {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            text-align: center;
        }
        
        .benefit-card:hover {
            transform: translateY(-5px);
        }
        
        .benefit-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background-color: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary-dark);
        }
        
        .benefit-card h3 {
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }
        
        .benefit-card p {
            color: var(--text-secondary);
        }
        
        .club-card {
            background: linear-gradient(135deg, #2e7d32, #689f38);
            border-radius: 15px;
            padding: 2rem;
            color: white;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .club-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .club-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .club-card h2 {
            position: relative;
            z-index: 1;
            margin-bottom: 1.5rem;
        }
        
        .club-card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        
        .club-card-info {
            flex: 1;
            min-width: 300px;
        }
        
        .club-card-image {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .club-card-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .club-form {
            background-color: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .club-form h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-dark);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }
        
        .form-submit {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        
        .form-submit:hover {
            background-color: var(--primary-color);
        }
        
        .club-levels {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin: 3rem 0;
        }
        
        .level-card {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            position: relative;
            overflow: hidden;
        }
        
        .level-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: var(--primary-color);
        }
        
        .level-card.gold::before {
            background-color: #ffd700;
        }
        
        .level-card.platinum::before {
            background-color: #e5e4e2;
        }
        
        .level-card h3 {
            color: var(--primary-dark);
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .level-card .level-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .level-card.gold .level-badge {
            background-color: #fffacd;
            color: #b8860b;
        }
        
        .level-card.platinum .level-badge {
            background
